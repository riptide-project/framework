[package]
name = "riptide/core"
version = "0.9.0-maelstrom.2"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
description = "A strict Luau framework for Roblox with side-specific APIs, typed networking/state, module lifecycle orchestration, and sandboxed plugins."
license = "MIT"
authors = ["Riptide Development Group (https://github.com/riptide-project)"]
homepage = "https://riptide-project.github.io/framework"
repository = "https://github.com/riptide-project/framework"
exclude = [
	"docs",
	"docs/**",
	"test",
	"test/**",
	"playground",
	"playground/**",
	"assets",
	"assets/**",
	".github",
	".github/**",
	".lune",
	".lune/**",
	".pesde",
	".pesde/**",
	"luau_packages",
	"luau_packages/**",
	"Packages",
	"Packages/**",
	"DevPackages",
	"DevPackages/**",
	"default.project.json",
	"dev.project.json",
	"pesde.toml",
	"pesde.lock",
	"mise.toml",
	"stylua.toml",
	"selene.toml",
	".luaurc",
	"CHANGELOG.md",
]
